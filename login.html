<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="assets/logo/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/logo/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/logo/favicon-192.png">
  <link rel="apple-touch-icon" href="assets/logo/apple-touch-icon.png">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Entrar — MUVVI</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
  <link rel="stylesheet" href="assets/css/site.css">
  <meta property="og:title" content="MUVVI — Museu Virtual do Vale do Ivaí">
  <meta property="og:description" content="O patrimônio cultural e natural do Vale do Ivaí, pesquisado e documentado por estudantes de História da UEM.">
  <meta property="og:image" content="https://muvvidev.github.io/assets/logo/muvvi-compartilhar.jpg">
  <meta property="og:url" content="https://muvvidev.github.io/">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
</head>
<body class="login-page">
  <form class="card" id="form" autocomplete="on" novalidate>
    <h1>Entrar</h1>
    <p class="sub">Acesse o editor da sua página.</p>
    <div id="google-area">
      <div id="g-btn"></div>
      <p class="hint-g" id="g-note"></p>
    </div>
    <div class="ou" id="ou"><span>ou entre com usuário e senha</span></div>
    <label class="f">Usuário<input name="u" autocomplete="username" autocapitalize="none" required autofocus></label>
    <label class="f">Senha<input name="p" type="password" autocomplete="current-password" required></label>
    <p class="err" id="err" role="alert"></p>
    <button class="btn accent" id="go">Entrar</button>
    <a class="back" href="./">← Voltar para o início</a>
  </form>
  <script type="module" src="assets/js/login.js"></script>
</body>
</html>
